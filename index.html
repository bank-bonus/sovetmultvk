<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- VK Bridge SDK -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Ruslan+Display&display=swap');
        
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
            background-color: #f0ead6; 
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 500px;
            padding: 10px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .active { display: flex; }

        h1, h2, h3 { font-family: 'Ruslan Display', cursive; text-transform: uppercase; margin: 0; line-height: 1; }
        
        .box {
            border: 4px solid #cc0000;
            background: #fff;
            padding: 15px;
            box-shadow: 6px 6px 0 #1a1a1a;
            width: 100%;
            border-radius: 4px;
            position: relative;
        }

        /* КНОПКИ */
        #answers-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .btn {
            background: #f0ead6;
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            padding: 10px 5px;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
            font-family: 'Oswald', sans-serif;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            line-height: 1.1;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        .btn-primary { background: #cc0000; color: #f0ead6; border-color: #1a1a1a; width: 100%; font-size: 18px; padding: 15px; }
        
        .btn-ad {
            background: #4a7c59; color: white; border: 3px dashed #fff; 
            box-shadow: 0 0 10px rgba(74, 124, 89, 0.5);
            width: 100%; padding: 12px; margin-top: 10px;
        }

        /* --- ТЕЛЕВИЗОР --- */
        .tv-frame {
            background: #5c3a21;
            padding: 15px;       
            border-radius: 16px;
            border: 2px solid #3e2716;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.5);
            width: 100%;
            margin-bottom: 5px;
            position: relative;
            max-height: 35vh; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-screen {
            background: #000;
            width: 100%;
            aspect-ratio: 4/3;
            position: relative;
            border-radius: 40% / 10%; 
            border-radius: 12px;
            border: 6px solid #1a1a1a; 
            box-shadow: inset 0 0 15px rgba(0,0,0,1); 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9) sepia(0.2); 
            position: relative;
            z-index: 1;
        }

        .tv-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }
        
        .result-box {
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #fff;
        }
        .result-img-container {
            width: 100%; 
            height: 140px; 
            margin: 10px 0; 
            border: 3px solid #1a1a1a; 
            border-radius: 4px; 
            overflow: hidden; 
            position: relative; 
            background: #111;
        }

        .desc-text {
            font-size: 13px;
            color: #555;
            font-style: italic;
            margin-top: 8px;
            line-height: 1.2;
            background: #f9f9f9;
            padding: 6px;
            border-left: 4px solid #cc0000;
            text-align: left;
            max-height: 80px; 
            overflow-y: auto;
        }

        .gameover-poster {
            border: 6px double #d4af37;
            background: #cc0000;
            color: #f0ead6;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .header {
            background: #cc0000; color: #f0ead6;
            width: 100%; 
            padding: 5px 15px;
            display: flex; justify-content: space-between;
            align-items: center;
            position: fixed; top: 0; left: 0; z-index: 100;
            border-bottom: 3px solid #a00000;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            height: 50px;
        }
        
        .spacer { height: 50px; width: 100%; flex-shrink: 0; }
        .hidden { display: none !important; }
        
        @keyframes correct-blink {
            0% { background-color: #f0ead6; }
            50% { background-color: #4a7c59; color: white; transform: scale(1.02); }
            100% { background-color: #4a7c59; color: white; transform: scale(1); }
        }
        @keyframes wrong-shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); background-color: #cc0000; color: white; }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); background-color: #cc0000; color: white; }
        }
    </style>
</head>

        </div>
        
        <div id="answers-container"></div>
    </div>

    <!-- РЕЗУЛЬТАТ -->

            <div class="result-img-container">

                <div id="txt-frame-label" style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; padding: 3px; font-size: 10px;">
                    КАДР ИЗ МУЛЬТФИЛЬМА
                </div>
            </div>

            <h3 id="result-correct-name" style="margin-bottom: 5px; color: #cc0000; font-size: 18px;">...</h3>
            
            <div class="desc-text">
                <span style="font-size: 16px; float: left; margin-right: 5px; line-height: 1;">💡</span>
                <span id="result-desc-text">...</span>
            </div>

            <button id="btn-next" class="btn btn-primary" onclick="game.nextQuestion()" style="margin-top: 10px;">ДАЛЕЕ >></button>
        </div>
    </div>

    <!-- КОНЕЦ ИГРЫ -->

                    ВЫЙТИ В МЕНЮ
                </button>
            </div>
        </div>

            .then(() => console.log('VK Bridge Init Success'))
            .catch(err => console.error('VK Bridge Init Failed', err));

        const params = new URLSearchParams(window.location.search);
        let lang = params.get('vk_language') || navigator.language.slice(0, 2);
        
        if (['en', 'tr'].indexOf(lang) === -1) lang = 'ru';
        game.setLanguage(lang);
        
        this.loadScore();
    },
    
    showInterstitial: function(callback) {
        console.log("Попытка показа рекламы (Interstitial)...");
        let adFinished = false;

        // Запускает игру, но только один раз
        const runGameOnce = () => {
            if (!adFinished) {
                adFinished = true;
                if (callback) callback();
            }
        };

        // Запасной вариант: если ВК не ответил за 1.5 секунды, запускаем игру
        setTimeout(() => {
            if (!adFinished) {
                console.warn("Таймаут рекламы (локальный запуск?), игра начинается.");
                runGameOnce();
            }
        }, 1500);

        // Запрос к ВК
        vkBridge.send("VKWebAppShowNativeAds", { ad_format: "interstitial" })
            .then(() => runGameOnce())
            .catch(() => runGameOnce());
    },

    showReward: function() {
        console.log("Проверка доступности Reward видео...");
        
        // 1. Сначала проверяем, есть ли реклама (чтобы не получать ошибку)
        vkBridge.send("VKWebAppCheckNativeAds", { ad_format: "reward" })
            .then((checkData) => {
                if (checkData.result) {
                    // 2. Реклама есть, пытаемся показать
                    vkBridge.send("VKWebAppShowNativeAds", { ad_format: "reward" })
                        .then(nativeData => {
                            if (nativeData.result) {
                                game.revive(); // Награда выдана
                            } else {
                                console.log("Реклама закрыта без просмотра");
                            }
                        })
                        .catch(error => {
                            console.error("Ошибка при показе:", error);
                            // Здесь не показываем алерт, просто пишем в консоль
                        });
                } else {
                    console.log("Нет доступной рекламы в данный момент");
                    alert("Реклама сейчас недоступна. Попробуйте позже или зайдите с телефона.");
                }
            })
            .catch((error) => {
                console.error("Ошибка проверки рекламы (вероятно, AdBlock или ПК):", error);
                alert("Не удалось загрузить рекламу. Если вы с компьютера или включен AdBlock, видео может не работать.");
            });
    },

    saveScore: function(score) {
        localStorage.setItem('sovietQuizHighScore', score);
        vkBridge.send('VKWebAppStorageSet', {
            key: 'highScore',
            value: score.toString()
        }).catch(e => console.log('StorageSet Error', e));
    },

    loadScore: function() {
        vkBridge.send('VKWebAppStorageGet', {
            keys: ['highScore']
        }).then(data => {
            if (data.keys && data.keys[0] && data.keys[0].value) {
                game.highScore = parseInt(data.keys[0].value);
                game.updateHighScoreUI();
            } else {
                const local = localStorage.getItem('sovietQuizHighScore');
                if(local) {
                    game.highScore = parseInt(local);
                    game.updateHighScoreUI();
                }
            }
        }).catch(error => {
            console.log("StorageGet Error, используем локальное:", error);
            const local = localStorage.getItem('sovietQuizHighScore');
            if(local) game.highScore = parseInt(local);
            game.updateHighScoreUI();
        });
    }
};

const game = {
    score: 0,
    lives: 3,
    highScore: 0,
    currentQ: null,
    isProcessing: false,
    curLang: 'ru',

    init: function() {
        adService.init();
        this.updateHighScoreUI();
    },

    setLanguage: function(lang) {
        this.curLang = lang;
        const T = TRANSLATIONS[lang];
        
        document.getElementById('txt-title').innerHTML = T.title;
        document.getElementById('txt-subtitle').innerText = T.subtitle;
        document.getElementById('btn-start').innerText = T.start;
        document.getElementById('txt-score-label').innerText = T.score;
        document.getElementById('txt-record').innerText = T.record;
        document.getElementById('txt-question').innerText = T.question;
        document.getElementById('txt-frame-label').innerText = T.frame_label;
        document.getElementById('btn-next').innerText = T.next;
        document.getElementById('txt-gameover').innerHTML = T.gameover;
        document.getElementById('txt-your-score').innerText = T.your_score;
        document.getElementById('txt-gameover-msg').innerText = T.gameover_msg;
        document.getElementById('btn-revive').innerText = T.revive;
        document.getElementById('txt-ad-hint').innerText = T.ad_hint;
        document.getElementById('btn-menu').innerText = T.menu;
    },

    start: function() {
        adService.showInterstitial(() => {
            this.score = 0;
            this.lives = 3;
            this.updateUI();
            document.getElementById('game-header').classList.remove('hidden');
            this.nextQuestion();
        });
    },

    menu: function() {
        this.showScreen('menu-screen');
        document.getElementById('game-header').classList.add('hidden');
    },

    nextQuestion: function() {
        this.isProcessing = false;
        this.showScreen('game-screen');

        const correct = CARTOONS[Math.floor(Math.random() * CARTOONS.length)];
        this.currentQ = correct;

        let others = CARTOONS.filter(c => c.id !== correct.id).map(c => c);
        others = others.sort(() => 0.5 - Math.random()).slice(0, 3);
        const optionsObjects = [correct, ...others].sort(() => 0.5 - Math.random());
        const options = optionsObjects.map(obj => obj[this.curLang].title);

        document.getElementById('quiz-img').src = correct.imageUrl;
        const container = document.getElementById('answers-container');
        container.innerHTML = '';

        options.forEach(optTitle => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = optTitle;
            btn.onclick = (e) => this.check(optTitle, correct[this.curLang].title, e.target);
            container.appendChild(btn);
        });
    },

    check: function(selectedTitle, correctTitle, btnElement) {
        if(this.isProcessing) return;
        this.isProcessing = true;

        const isCorrect = selectedTitle === correctTitle;
        
        if (isCorrect) {
            btnElement.style.animation = "correct-blink 0.5s forwards";
            this.score += 100;
        } else {
            btnElement.style.animation = "wrong-shake 0.5s forwards";
            this.lives--;
            const buttons = document.querySelectorAll('#answers-container button');
            buttons.forEach(b => {
                if(b.innerText === correctTitle) {
                    b.style.backgroundColor = "#4a7c59";
                    b.style.color = "white";
                }
            });
        }

        this.updateUI();

        setTimeout(() => {
            this.showResult(isCorrect);
        }, 2000); 
    },

    showResult: function(isCorrect) {
        if (!isCorrect && this.lives <= 0) {
            this.gameOver();
            return;
        }

        const T = TRANSLATIONS[this.curLang];
        const title = document.getElementById('result-title');
        title.innerText = isCorrect ? T.correct : T.wrong;
        title.style.color = isCorrect ? "#4a7c59" : "#cc0000";

        document.getElementById('result-correct-name').innerText = this.currentQ[this.curLang].title;
        document.getElementById('result-img').src = this.currentQ.imageUrl;
        document.getElementById('result-desc-text').innerText = this.currentQ[this.curLang].desc;

        this.showScreen('result-screen');
    },

    gameOver: function() {
        if (this.score > this.highScore) {
            this.highScore = this.score;
            adService.saveScore(this.score);
            this.updateHighScoreUI();
        }
        document.getElementById('final-score').innerText = this.score;
        document.getElementById('game-header').classList.add('hidden');
        this.showScreen('gameover-screen');
    },

    revive: function() {
        this.lives = 1;
        this.updateUI();
        document.getElementById('game-header').classList.remove('hidden');
        this.nextQuestion();
    },

    updateUI: function() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('lives-val').innerText = '❤️'.repeat(this.lives);
    },

    updateHighScoreUI: function() {
        if(this.highScore > 0) {
            const box = document.getElementById('highscore-box');
            if(box) box.style.display = 'block';
            document.getElementById('high-score-val').innerText = this.highScore;
        }
    },

    showScreen: function(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }
};

window.onload = function() {
    game.init();
};
</script>
